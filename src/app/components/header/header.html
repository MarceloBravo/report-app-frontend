<header
    class="fixed top-0 left-72 right-0 h-16 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] z-40 px-8 flex items-center justify-between gap-6">
    <div class="flex items-center gap-4 flex-1 max-w-md">
        <div class="relative w-full flex items-center"><span
                class="material-symbols-outlined absolute left-3 text-outline text-18">search</span><input
                class="header-search-input"
                placeholder="Buscar tablas, esquemas, consultas SQL... (⌘K)" type="text" /></div>
    </div>
    <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 px-3 py-1-5 rounded-full bg-surface-container-low"><span
                class="w-2 h-2 rounded-full bg-primary-container shadow-[0_0_8px_rgba(6,182,212,0.6)]"></span><span
                class="font-label text-xs tracking-tight text-on-surface">PostgreSQL 16</span><span
            class="font-label text-10 px-1-5 py-0-5 rounded bg-surface-container-highest text-primary font-semibold">ONLINE</span>
        </div><button
            class="w-9 h-9 rounded-lg bg-surface-container-low hover:bg-surface-container-high flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors relative"
            type="button"><span class="material-symbols-outlined text-18">notifications</span><span
                class="absolute top-2 right-2 w-1-5 h-1-5 rounded-full bg-primary"></span></button>
        <div class="flex items-center gap-3 pl-2">
            <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span
                    class="material-symbols-outlined text-on-primary text-18">person</span></div>
        </div>
    </div>
</header>
